name: RSB setup
description: Check out the RTEMS Source Builder and prepare the host

inputs:
  repository:
    description: RSB repository
    required: true
  ref:
    description: RSB branch or tag
    required: true

runs:
  using: composite
  steps:
  - uses: actions/checkout@v7
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      fetch-depth: 0
      path: rtems-source-builder
  - name: "apt-get install"
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get -y install bison flex texinfo unzip python3-dev zlib1g-dev
  - name: Check RSB host environment
    shell: bash
    working-directory: rtems-source-builder
    run: ./source-builder/sb-check

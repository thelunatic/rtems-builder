name: EPICS Base
description: Build and test EPICS Base for one RTEMS target with ci-scripts

inputs:
  cross:
    description: CI_CROSS_TARGETS value
    required: true
  test:
    description: NO skips the tests
    default: ''
  timeout:
    description: cue.py test timeout
    default: 15M
  repository:
    description: EPICS Base repository, empty for the caller
    default: epics-base/epics-base
  ref:
    description: EPICS Base ref, empty for the caller ref
    default: '7.0'

runs:
  using: composite
  steps:
  - uses: actions/checkout@v7
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      submodules: true
      path: epics-base
  - name: Set ci-scripts environment
    shell: bash
    run: |
      echo "CMP=gcc" >> "$GITHUB_ENV"
      echo "BCFG=default" >> "$GITHUB_ENV"
      echo "BASE=SELF" >> "$GITHUB_ENV"
      echo "CI_CROSS_TARGETS=${{ inputs.cross }}" >> "$GITHUB_ENV"
      echo "TEST=${{ inputs.test }}" >> "$GITHUB_ENV"
      echo "SETUP_PATH=../ci-scripts" >> "$GITHUB_ENV"
  - name: Prepare and compile dependencies
    shell: bash
    working-directory: epics-base
    run: python ../ci-scripts/cue.py prepare
  - name: Build EPICS Base
    shell: bash
    working-directory: epics-base
    run: python ../ci-scripts/cue.py build
  - name: Run EPICS Base tests
    shell: bash
    working-directory: epics-base
    run: python ../ci-scripts/cue.py -T ${{ inputs.timeout }} test
  - name: Upload tapfiles Artifact
    if: ${{ always() }}
    uses: actions/upload-artifact@v7
    with:
      name: tapfiles ${{ inputs.cross }}
      path: 'epics-base/**/O.*/*.tap'
      if-no-files-found: ignore
  - name: Collect and show test results
    if: ${{ always() }}
    shell: bash
    working-directory: epics-base
    run: python ../ci-scripts/cue.py -T 5M test-results

name: RTEMS 6

on:
  workflow_dispatch:
  schedule:
  - cron: '0 6 * * 0'

jobs:
  build-rtems-i386:
    uses: ./.github/workflows/rtems-6-arch.yml
    permissions:
      contents: write
    with:
      arch: i386

  build-rtems-powerpc:
    uses: ./.github/workflows/rtems-6-arch.yml
    permissions:
      contents: write
    with:
      arch: powerpc

  build-rtems-arm:
    uses: ./.github/workflows/rtems-6-arch.yml
    permissions:
      contents: write
    with:
      arch: arm

  build-rtems-m68k:
    uses: ./.github/workflows/rtems-6-arch.yml
    permissions:
      contents: write
    with:
      arch: m68k

  build-bsp-pc686:
    needs: build-rtems-i386
    uses: ./.github/workflows/rtems-6-bsp.yml
    permissions:
      contents: write
    with:
      arch: i386
      bsp: pc686
      cross: RTEMS-pc686-qemu@6

  build-bsp-beatnik:
    needs: build-rtems-powerpc
    uses: ./.github/workflows/rtems-6-bsp.yml
    permissions:
      contents: write
    with:
      arch: powerpc
      bsp: beatnik
      cross: RTEMS-beatnik@6
      test: NO

  build-bsp-xilinx_zynq_a9_qemu:
    needs: build-rtems-arm
    uses: ./.github/workflows/rtems-6-bsp.yml
    permissions:
      contents: write
    with:
      arch: arm
      bsp: xilinx_zynq_a9_qemu
      cross: RTEMS-xilinx_zynq_a9_qemu@6
      test: NO

  build-bsp-uC5282:
    needs: build-rtems-m68k
    uses: ./.github/workflows/rtems-6-bsp.yml
    permissions:
      contents: write
    with:
      arch: m68k
      bsp: uC5282
      cross: RTEMS-uC5282@6
      test: NO

  build-bsp-mvme2100:
    needs: build-rtems-powerpc
    uses: ./.github/workflows/rtems-6-bsp.yml
    permissions:
      contents: write
    with:
      arch: powerpc
      bsp: mvme2100
      cross: RTEMS-mvme2100@6
      test: NO

  build-bsp-mvme2700:
    needs: build-rtems-powerpc
    uses: ./.github/workflows/rtems-6-bsp.yml
    permissions:
      contents: write
    with:
      arch: powerpc
      bsp: mvme2700
      cross: RTEMS-mvme2700@6
      test: NO

  build-bsp-mvme5100:
    needs: build-rtems-powerpc
    uses: ./.github/workflows/rtems-6-bsp.yml
    permissions:
      contents: write
    with:
      arch: powerpc
      bsp: mvme5100
      cross: RTEMS-mvme5100@6
      test: NO

  build-bsp-mvme3100:
    needs: build-rtems-powerpc
    uses: ./.github/workflows/rtems-6-bsp.yml
    permissions:
      contents: write
    with:
      arch: powerpc
      bsp: mvme3100
      cross: RTEMS-mvme3100@6
      test: NO

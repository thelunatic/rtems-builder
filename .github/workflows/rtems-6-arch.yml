on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true

jobs:
  build-rtems:
    name: RTEMS 6 ${{ inputs.arch }} toolchain
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        repository: thelunatic/rtems-source-builder
        ref: 6_update_rtems
        fetch-depth: 0
        path: rtems-source-builder
    - name: "apt-get install"
      run: |
        sudo apt-get update
        sudo apt-get -y install bison flex texinfo unzip python3-dev zlib1g-dev
    - name: Check RSB host environment
      working-directory: rtems-source-builder
      run: ./source-builder/sb-check
    - name: Create /opt/rtems/6
      run: |
        sudo mkdir -p /opt/rtems/6
        sudo chown $(id -u):$(id -g) /opt/rtems/6
    - name: Build ${{ inputs.arch }} tools
      working-directory: rtems-source-builder/rtems
      run: ../source-builder/sb-set-builder --prefix=/opt/rtems/6 6/rtems-${{ inputs.arch }}
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: rsb-report ${{ inputs.arch }}-rtems6
        path: rtems-source-builder/rtems/rsb-report-*.txt
    - name: Show compiler version
      run: /opt/rtems/6/bin/${{ inputs.arch }}-rtems6-gcc --version
    - name: Pack toolchain
      run: tar -C / -cJf ${{ inputs.arch }}-rtems6.tar.xz opt/rtems/6
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.arch }}-rtems6.tar.xz
        path: ${{ inputs.arch }}-rtems6.tar.xz

  release:
    name: Publish ${{ inputs.arch }}-rtems6.tar.xz
    needs: build-rtems
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.arch }}-rtems6.tar.xz
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if ! gh release view 6/${{ inputs.arch }} --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release create 6/${{ inputs.arch }} ${{ inputs.arch }}-rtems6.tar.xz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
          exit 0
        fi
        cp ${{ inputs.arch }}-rtems6.tar.xz ${{ inputs.arch }}-rtems6.tar.xz.$GITHUB_RUN_NUMBER
        gh release upload 6/${{ inputs.arch }} ${{ inputs.arch }}-rtems6.tar.xz.$GITHUB_RUN_NUMBER \
          --clobber --repo "$GITHUB_REPOSITORY"
        gh release delete-asset 6/${{ inputs.arch }} ${{ inputs.arch }}-rtems6.tar.xz \
          --yes --repo "$GITHUB_REPOSITORY" || true
        gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
          --jq ".[] | select(.tag_name == \"6/${{ inputs.arch }}\") | .assets[] | select(.name == \"${{ inputs.arch }}-rtems6.tar.xz.$GITHUB_RUN_NUMBER\") | .id" \
          | grep . \
          | xargs -I{} gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/{}" -f name=${{ inputs.arch }}-rtems6.tar.xz
        gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/6/${{ inputs.arch }}" \
          -f sha="$GITHUB_SHA" -F force=true
